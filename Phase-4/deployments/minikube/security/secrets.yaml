apiVersion: v1
kind: Secret
metadata:
  name: todo-chatbot-secrets
  namespace: todo-chatbot
  labels:
    app: todo-chatbot
type: Opaque
stringData:
  # PostgreSQL password
  # IMPORTANT: Replace with actual secure password before applying
  postgres-password: "REPLACE_WITH_SECURE_PASSWORD"

  # JWT secret for authentication
  # IMPORTANT: Replace with actual secure random string before applying
  jwt-secret: "REPLACE_WITH_SECURE_JWT_SECRET"

  # Google Gemini API key (optional)
  # IMPORTANT: Replace with actual API key if using Gemini
  google-gemini-api-key: "REPLACE_WITH_GEMINI_API_KEY"

  # Groq API key (optional)
  # IMPORTANT: Replace with actual API key if using Groq
  groq-api-key: "REPLACE_WITH_GROQ_API_KEY"

---
# NOTE: To create secrets from command line instead:
# kubectl create secret generic todo-chatbot-secrets \
#   --namespace=todo-chatbot \
#   --from-literal=postgres-password=YOUR_SECURE_PASSWORD \
#   --from-literal=jwt-secret=YOUR_SECURE_JWT_SECRET \
#   --from-literal=google-gemini-api-key=YOUR_GEMINI_KEY \
#   --from-literal=groq-api-key=YOUR_GROQ_KEY
