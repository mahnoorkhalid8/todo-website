apiVersion: v1
kind: Secret
metadata:
  name: todo-chatbot-secrets
  namespace: todo-chatbot
  labels:
    app: todo-chatbot
type: Opaque
stringData:
  # PostgreSQL password
  postgres-password: "npg_1wiNqRWc4MPh"

  # JWT secret for authentication
  # jwt-secret: "o2nmkwIUqotG5dDCWR0a0rk2Uk2rL0DPBvqbdkwZ54N"
  jwt-secret: JWT_SECRET

  # Google Gemini API key
  # google-gemini-api-key: "AIzaSyD_seqRzo0a9a5dGny6u1dGQ1eXoqhGdwQ"
  google-gemini-api-key: GEMINI_API_KEY

  # Groq API key
  # groq-api-key: "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"
  groq-api-key: GROQ_API_KEY

---
# NOTE: To create secrets from command line instead:
# kubectl create secret generic todo-chatbot-secrets \
#   --namespace=todo-chatbot \
#   --from-literal=postgres-password=YOUR_SECURE_PASSWORD \
#   --from-literal=jwt-secret=YOUR_SECURE_JWT_SECRET \
#   --from-literal=google-gemini-api-key=YOUR_GEMINI_KEY \
#   --from-literal=groq-api-key=YOUR_GROQ_KEY
