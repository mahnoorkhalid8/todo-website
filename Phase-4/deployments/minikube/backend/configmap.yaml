apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: todo-chatbot
  labels:
    app: backend
data:
  # Application configuration
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"

  # Database configuration (non-sensitive)
  DATABASE_HOST: "postgresql.todo-chatbot.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "todo_chatbot"
  DATABASE_USER: "postgres"

  # CORS configuration
  ALLOWED_ORIGINS: "http://localhost:3000,http://frontend.todo-chatbot.svc.cluster.local:3000,http://todo.local"

  # Application settings
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "local"
