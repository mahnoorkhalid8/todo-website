apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: todo-chatbot
  labels:
    app: frontend
data:
  # API endpoint configuration
  NEXT_PUBLIC_API_URL: "http://backend.todo-chatbot.svc.cluster.local:8000"
  NEXT_PUBLIC_API_BASE_URL: "http://todo.local/api"

  # Application settings
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"

  # Server configuration
  HOSTNAME: "0.0.0.0"
  PORT: "3000"
